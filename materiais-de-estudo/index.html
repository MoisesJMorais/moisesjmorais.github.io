<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante Acadêmica</title>
    <style>
        /* Configurações Globais e Dark Mode */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header h1 {
            font-size: 2rem;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 1px;
        }

        header p {
            color: #888;
            font-size: 0.95rem;
            margin-top: 8px;
        }

        /* Container de Filtros e Busca */
        .controls-container {
            max-width: 1200px;
            width: 100%;
            margin: 20px auto 10px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .search-bar {
            width: 100%;
            max-width: 450px;
            padding: 12px 20px;
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar:focus {
            border-color: #2563eb;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .filter-btn {
            background-color: #1e1e1e;
            color: #aaa;
            border: 1px solid #2d2d2d;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }

        /* Container da Estante */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 20px 40px;
            flex: 1;
        }

        .bookshelf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 30px;
            justify-items: center;
        }

        /* Estilo do Card do Livro/PDF */
        .book-card {
            position: relative;
            width: 100%;
            max-width: 200px;
            aspect-ratio: 3 / 4;
            border-radius: 8px;
            overflow: hidden;
            background-color: #1e1e1e;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
            cursor: pointer;
        }

        .book-card.hidden {
            display: none;
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }

        .book-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Overlay com informações ao passar o mouse */
        .book-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 18, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .book-card:hover .book-overlay {
            opacity: 1;
        }

        .book-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .book-category {
            font-size: 0.75rem;
            color: #3b82f6;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-download {
            background-color: #2563eb;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .btn-download:hover {
            background-color: #1d4ed8;
        }

        /* Rodapé simples */
        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 0.85rem;
            border-top: 1px solid #1e1e1e;
        }

        /* Responsividade para telas menores */
        @media (max-width: 600px) {
            .bookshelf-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Estante Acadêmica</h1>
        <p>Repositório de materiais de estudo e pesquisas</p>
    </header>

    <!-- Seção de Controles (Busca e Filtros) -->
    <div class="controls-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="Buscar por título...">
        
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="matematica">Matemática</button>
            <button class="filter-btn" data-filter="computacao">Computação</button>
            <button class="filter-btn" data-filter="fisica">Física</button>
            <button class="filter-btn" data-filter="metodologia">Metodologia</button>
        </div>
    </div>

    <main class="container">
        <div class="bookshelf-grid" id="booksGrid">
            
            <!-- Item 1 -->
            <div class="book-card" data-category="matematica" data-title="cálculo avançado vol. 1">
                <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=500&q=80" alt="Capa PDF">
                <div class="book-overlay">
                    <span class="book-category">Matemática</span>
                    <h3 class="book-title">Cálculo Avançado Vol. 1</h3>
                    <a href="seu-arquivo1.pdf" class="btn-download" target="_blank">Abrir PDF</a>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="book-card" data-category="computacao" data-title="estruturas de dados e algoritmos">
                <img src="https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&w=500&q=80" alt="Capa PDF">
                <div class="book-overlay">
                    <span class="book-category">Computação</span>
                    <h3 class="book-title">Estruturas de Dados e Algoritmos</h3>
                    <a href="seu-arquivo2.pdf" class="btn-download" target="_blank">Abrir PDF</a>
                </div>
            </div>

            <!-- Item 3 -->
            <div class="book-card" data-category="fisica" data-title="mecânica quântica aplicada">
                <img src="https://images.unsplash.com/photo-1507842229443-77783618cdc3?auto=format&fit=crop&w=500&q=80" alt="Capa PDF">
                <div class="book-overlay">
                    <span class="book-category">Física</span>
                    <h3 class="book-title">Mecânica Quântica Aplicada</h3>
                    <a href="seu-arquivo3.pdf" class="btn-download" target="_blank">Abrir PDF</a>
                </div>
            </div>

            <!-- Item 4 -->
            <div class="book-card" data-category="metodologia" data-title="guia de artigos científicos">
                <img src="https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=500&q=80" alt="Capa PDF">
                <div class="book-overlay">
                    <span class="book-category">Metodologia</span>
                    <h3 class="book-title">Guia de Artigos Científicos</h3>
                    <a href="seu-arquivo4.pdf" class="btn-download" target="_blank">Abrir PDF</a>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Sua Estante Acadêmica</p>
    </footer>

    <!-- Script de Filtragem e Busca -->
    <script>
        const searchInput = document.getElementById('searchInput');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const bookCards = document.querySelectorAll('.book-card');

        let currentCategory = 'all';

        // Função principal para filtrar os livros
        function filterBooks() {
            const searchTerm = searchInput.value.toLowerCase().trim();

            bookCards.forEach(card => {
                const category = card.getAttribute('data-category');
                const title = card.getAttribute('data-title');

                const matchesCategory = (currentCategory === 'all' || category === currentCategory);
                const matchesSearch = title.includes(searchTerm);

                if (matchesCategory && matchesSearch) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        // Evento de digitação na busca
        searchInput.addEventListener('input', filterBooks);

        // Evento de clique nos botões de categoria
        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Remove a classe active de todos e adiciona no clicado
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                // Atualiza a categoria atual e executa o filtro
                currentCategory = button.getAttribute('data-filter');
                filterBooks();
            });
        });
    </script>

</body>
</html>
